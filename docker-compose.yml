services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n

      # Enable all nodes (don't exclude Execute Command / Local File Trigger)
      NODES_EXCLUDE: "[]"

      # Restrict file access for file-related nodes (optional)
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files

      # Task runners (external mode)
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: "external"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_AUTH_TOKEN: "change-this-to-a-long-random-secret"

      # Native Python in Code node uses task runners
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_PYTHON_ENABLED: "true"

    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
      - ./workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  task-runners:
    build:
      context: .
      dockerfile: Dockerfile.runners
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      # IMPORTANT: use the service name "n8n", not container_name
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n:5679"
      N8N_RUNNERS_AUTH_TOKEN: "change-this-to-a-long-random-secret"
      # Optional (launcher health endpoint port)
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"
    volumes:
      - ./workspace:/workspace
    depends_on:
      - n8n

volumes:
  n8n_data:
  n8n_files:
  pg_data:
